<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriftCue · 本地验收页</title><style>body{margin:0;font:16px/1.7 system-ui;background:#f3f6ef;color:#25473b}main{max-width:900px;margin:auto;padding:40px 24px}h1{font-size:36px}button{padding:12px 18px;border:1px solid #c4d5c7;border-radius:8px;background:white;color:#25473b;font:inherit;cursor:pointer;margin:5px}#field{position:relative;height:480px;background:#e0e9d9;border-radius:20px;padding:24px}#click-layer{position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;border:0}#click-layer span{position:relative;pointer-events:none}pre{white-space:pre-wrap;background:white;padding:18px;border-radius:12px}#spacer{height:1400px}label{display:block}input{padding:10px}#full{background:#12372b;color:white;padding:25px;border-radius:14px}#full:fullscreen{display:flex;align-items:center;justify-content:center;flex-direction:column}</style></head><body><main><small>LOCAL ACCEPTANCE / NO ACCOUNT DATA</small><h1>DriftCue 交互验收</h1><p>此页不使用真实账号。开启本站提醒后，记录卡片出现、消失、位置、焦点、全屏与点击结果。</p><button id="reset">清空本页记录</button><button id="fullscreen">进入播放器全屏</button><button id="default-run">开始默认 240 秒验收记录</button><label>焦点测试输入框 <input id="typing" placeholder="输入时不应被卡片抢焦点"></label><p id="counter">点击计数：0</p><section id="field"><button id="click-layer"><span>整个区域均可点击 · 卡片覆盖时也应正常响应</span></button></section><section id="full"><p>本地播放器全屏测试区域</p><button id="exit">退出全屏</button></section><pre id="report">等待提醒……</pre><div id="spacer">向下滚动检验固定视口位置</div></main><script src="/fixture.js"></script></body></html>
